# sway as the login screen's compositor (basalt-greeter): no key bindings,
# no bar, no XWayland, no configuration reloads. VT switching (Ctrl+Alt+F1
# to F6) is handled by sway itself and stays available.
xwayland disable
swaynag_command /usr/bin/true
swaybg_command -
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 0

input type:touchpad {
    tap enabled
    natural_scroll disabled
}

exec /usr/libexec/basalt-greeter/greeter-ui
