# basalt-voiced settings (read by the basalt-voice user service).
# Everything runs on this computer; nothing is sent anywhere. Models are
# downloaded by an administrator: basalt-voice-fetch default.

# Speech to text: whisper.cpp (package basalt-voice) with Silero voice
# activity detection.
BASALT_VOICE_STT_BIN=/usr/lib64/basalt-voice/whisper-cli
BASALT_VOICE_STT_MODEL=/var/lib/basalt-voice/models/ggml-base.en.bin
BASALT_VOICE_VAD_MODEL=/var/lib/basalt-voice/models/ggml-silero-v5.1.2.bin
BASALT_VOICE_THREADS=4

# Text to speech: Piper (not packaged yet) with a voice trained from
# public-domain data. Without it, answers are shown and not spoken.
BASALT_VOICE_TTS_BIN=/usr/libexec/basalt-voice/piper/piper
BASALT_VOICE_TTS_MODEL=/var/lib/basalt-voice/models/en_US-ljspeech-medium.onnx

# The microphone closes by itself after this many seconds of holding.
BASALT_VOICE_MAX_HOLD=30

# Each person chooses their own speech language, speech model and voice
# (Settings, Voice and assistant, saved in their
# ~/.config/basalt/voice-and-assistant.conf); these are the defaults and
# the limits. The voice service checks every choice against them.
#
# Default speech language: auto (needs a multilingual model) or a tag such
# as en-US or pt-BR. The .en models understand English only.
BASALT_VOICE_LANGUAGE=en
# Speech models and voices a person may choose, by name (space
# separated); empty: every installed one. The defaults above are always
# allowed.
#BASALT_VOICE_ALLOWED_MODELS=ggml-base.en ggml-base-q5_1 en_US-ljspeech-medium
# The largest speech model a person may choose, in MiB (0: no limit).
#BASALT_VOICE_MAX_MODEL_MB=600
# More directories with models (colon separated); the directories of the
# default models are always searched.
#BASALT_VOICE_MODEL_DIRS=
