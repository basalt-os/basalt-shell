# Which language models a person may choose for the desktop's assistant
# (Settings, Voice and assistant). Read by the Basalt shell daemon.
#
# The local choice is always available: the command bar's model settings,
# the [translator] section of /etc/basalt/assistant.conf (normally the
# local basalt-llm service, which has no network).
#
# A remote model is offered only when allow_remote = yes here AND the
# person turns on "Allow a remote model" in their own settings. A remote
# model receives the person's requests and the content the assistant
# reads for them (files, messages, pages). People cannot add endpoints:
# only the ones listed below, https only. Each person keeps their own key
# for it in a private file (mode 0600) named in their settings.

[policy]
allow_remote = no

#[remote example]
#label = Example provider
#endpoint = https://api.example.com/v1
#model = their-model-name
