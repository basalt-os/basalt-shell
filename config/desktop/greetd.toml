# Basalt OS desktop edition: the login screen (greetd with basalt-greeter
# on the first virtual terminal; the text login, tuigreet, when the
# graphical one cannot run), starting the Basalt session on sway or the
# session the person picks. Read by greetd through
# /usr/lib/systemd/system/greetd.service.d/50-basalt.conf. Settings of the
# login screen: /etc/basalt/greeter.conf.
[terminal]
vt = 1

[default_session]
command = "/usr/libexec/basalt-greeter/greeter-session"
user = "greetd"
