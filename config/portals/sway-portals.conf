# xdg-desktop-portal backends for the Basalt shell on sway / SwayFX:
# GTK for dialogs (file chooser, app chooser, settings), wlr for screen
# capture (PipeWire), GNOME Keyring for secrets.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=none
