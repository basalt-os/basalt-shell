# xdg-desktop-portal backends for the Basalt shell on sway / SwayFX:
# GTK for dialogs (file chooser, app chooser), GNOME's backend for the
# settings portal too (it also publishes accent-color, which the GTK
# backend does not; libadwaita follows it live), wlr for screen capture
# (PipeWire; the output is chosen in the Basalt shell), GNOME Keyring for
# secrets.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gnome;gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=none
