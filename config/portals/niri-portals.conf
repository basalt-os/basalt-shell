# xdg-desktop-portal backends for the Basalt shell on niri: GNOME's
# backend for screen capture (niri implements the Mutter screen cast API),
# GTK for dialogs, GNOME Keyring for secrets.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
