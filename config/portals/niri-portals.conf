# xdg-desktop-portal backends for the Basalt shell on niri: GNOME's
# backend for screen casting (niri implements the Mutter screen cast API,
# with its own window and output chooser), wlr for screenshots (in the lab
# xdg-desktop-portal-gnome 50 never answered screenshot requests on niri,
# while niri's wlr-screencopy works), GTK for dialogs, GNOME Keyring for
# secrets.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
