# Basalt OS login screen (basalt-greeter).
#
# GREETER=graphical    the graphical login screen (default)
# GREETER=text         the text login (tuigreet), on every start
# THEME=basalt         basalt, lichen or tide (the shell's themes)
# MODE=dark            dark or light
# HIDE_USERS=          user names not listed (comma separated); they can
#                      still log in with "Other user"
# DEFAULT_SESSION=     a file in /usr/share/wayland-sessions for people
#                      who never logged in here (default: basalt-sway.desktop)
GREETER=graphical
THEME=basalt
MODE=dark
HIDE_USERS=
DEFAULT_SESSION=basalt-sway.desktop
